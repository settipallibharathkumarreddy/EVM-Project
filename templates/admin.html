<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <style>

        body {
            font-family: Arial;

            background: #eef2ff;

            text-align: center;

            padding: 100px 20px;
        }

        .box {
            background: white;

            width: 380px;

            max-width: 100%;

            margin: auto;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.1);
        }

        input {
            width: 100%;

            padding: 13px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 7px;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 15px;

            background: #1e293b;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;
        }

        .error {
            color: red;

            margin-bottom: 15px;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            text-decoration: none;

            color: #2563eb;
        }

    </style>

</head>

<body>


<div class="box">


    <h1>
        🔐 Admin Login
    </h1>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form
        action="/admin-login"
        method="POST">


        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Admin Password"
            required
        >


        <button type="submit">

            Login

        </button>


    </form>


    <a href="/">

        ← Back to Home

    </a>


</div>


</body>

</html>
