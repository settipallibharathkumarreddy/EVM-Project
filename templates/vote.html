<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cast Vote</title>

    <style>

        body {
            font-family: Arial;

            background: #eef2ff;

            text-align: center;

            padding: 50px 20px;
        }

        .box {
            background: white;

            width: 450px;

            max-width: 100%;

            margin: auto;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;

            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            margin-bottom: 20px;
        }

        .candidate {
            text-align: left;

            padding: 16px;

            margin: 12px 0;

            border: 1px solid #ddd;

            border-radius: 8px;
        }

        .candidate:hover {
            background: #f8fafc;
        }

        .submit {
            width: 100%;

            padding: 14px;

            margin-top: 15px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            text-decoration: none;

            color: #2563eb;
        }

    </style>

</head>

<body>


<div class="box">

    <h1>
        🗳️ Cast Your Vote
    </h1>

    <p class="subtitle">
        Enter your Voter ID
        and select one candidate.
    </p>


    <form action="/cast-vote"
          method="POST">


        <input
            type="text"
            name="voter_id"
            placeholder="Enter Voter ID"
            required
        >


        <div class="candidate">

            <input
                type="radio"
                name="candidate"
                value="Candidate A"
                required
            >

            Candidate A

        </div>


        <div class="candidate">

            <input
                type="radio"
                name="candidate"
                value="Candidate B"
            >

            Candidate B

        </div>


        <div class="candidate">

            <input
                type="radio"
                name="candidate"
                value="Candidate C"
            >

            Candidate C

        </div>


        <button
            class="submit"
            type="submit">

            Submit Vote

        </button>


    </form>


    <a href="/"
       class="back">

        ← Back to Home

    </a>


</div>


</body>

</html>
