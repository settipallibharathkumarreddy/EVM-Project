<!DOCTYPE html>
<html>

<head>

    <title>Vote Status</title>

    <style>

        body {
            font-family: Arial;

            background: #eef2ff;

            text-align: center;

            padding: 100px 20px;
        }

        .box {
            background: white;

            width: 500px;

            max-width: 100%;

            margin: auto;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.1);
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        a {
            display: inline-block;

            margin-top: 25px;

            padding: 12px 25px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

    </style>

</head>

<body>


<div class="box">


{% if success %}

    <h1 class="success">
        ✅ Vote Submitted!
    </h1>

    <p>
        Your vote was successfully recorded.
    </p>

    <p>

        Candidate:

        <strong>
            {{ candidate }}
        </strong>

    </p>


{% else %}

    <h1 class="error">
        ⚠️ Vote Not Submitted
    </h1>

    <p>
        {{ message }}
    </p>


{% endif %}


<a href="/">
    Back to Home
</a>


</div>


</body>

</html>
